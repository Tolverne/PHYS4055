name: Encode assignment diagram for visual solution review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-assignment-diagram.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pymupdf pillow
      - name: Render the original graph panel and encode for audit
        run: |
          mkdir -p exam_prep/source_extractions/assignment_diagrams
          python - <<'PY'
          import fitz,io,base64
          from PIL import Image,ImageEnhance
          from pathlib import Path
          p="source_material/assignments/questions/PHYS4055_A2-3.pdf"
          with fitz.open(p) as d:
            for i in range(len(d)):
              pix=d[i].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
              im=Image.frombytes("RGB",[pix.width,pix.height],pix.samples)
              im.thumbnail((1300,1900))
              b=io.BytesIO();im.save(b,format="JPEG",quality=82,optimize=True)
              d64=base64.b64encode(b.getvalue()).decode()
              Path(f"exam_prep/source_extractions/assignment_diagrams/assignment4_page{i+1}.b64.txt").write_text(d64)
              print(i+1,len(d64))
          PY
      - name: Commit temporary image audit representation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam_prep/source_extractions/assignment_diagrams/
          git commit -m 'Prepare A4 Zeeman figure for accurate solution review'
          git pull --rebase origin main
          git push origin main
