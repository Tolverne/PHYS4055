name: Extract tutorial and assignment problem sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-problem-sources.yml'
      - 'scripts/index_problem_sources.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pymupdf
      - run: python scripts/index_problem_sources.py
      - name: Publish searchable original-question text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam_prep/source_extractions/problem_sources
          if ! git diff --cached --quiet; then
            git commit -m 'Index uploaded tutorials, assignments and exam PDFs'
            git push
          fi
