name: Extract PHYS4055 lecture slide text

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyMuPDF
        run: pip install --quiet pymupdf
      - name: Extract slides
        run: python scripts/index_lecture_slides.py
      - name: Commit slide text index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam_prep/source_extractions/lecture_slides
          if ! git diff --cached --quiet; then
            git commit -m 'Extract searchable PDF page text from supplied slides'
            git push
          fi
